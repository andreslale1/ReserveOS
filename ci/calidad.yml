name: Calidad
on:
  push: { branches: [main] }
  pull_request:
jobs:
  web:
    name: Tipos, lint y build (web)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ejemplo.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ejemplo
  base-de-datos:
    name: Migraciones desde cero y reglas de negocio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Instalar PGlite
        working-directory: tests/local-pglite
        run: npm i --no-save @electric-sql/pglite
      - name: Reconstruir la base con TODAS las migraciones y correr las pruebas
        working-directory: tests/local-pglite
        run: node verificar-todo.mjs
